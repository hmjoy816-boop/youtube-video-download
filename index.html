<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipbox – Video downloader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f3ff; --card: #ffffff; --text: #1b1535; --muted: #6b6788;
    --line: #e4e0f5; --accent: #5b3df5; --accent-ink: #ffffff; --danger: #d6336c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12101f; --card: #1c1930; --text: #f0eeff; --muted: #9a96b8;
      --line: #2f2b4a; --accent: #8b74ff; --accent-ink: #12101f; --danger: #ff6b9a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: var(--bg); color: var(--text); font-family: "Inter", system-ui, sans-serif;
  }
  main { width: 100%; max-width: 560px; }
  h1 {
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 800;
    font-size: clamp(2.2rem, 7vw, 3.2rem); letter-spacing: -0.03em; margin: 0 0 8px;
  }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px;
  }
  .row { display: flex; gap: 10px; }
  input[type=url], select {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; outline: none;
  }
  input[type=url] { flex: 1; min-width: 0; }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button {
    font: inherit; font-weight: 600; cursor: pointer; border: 0; border-radius: 12px;
    background: var(--accent); color: var(--accent-ink); padding: 14px 22px;
  }
  button:disabled { opacity: .55; cursor: default; }
  .preview { margin-top: 18px; display: none; }
  .preview.show { display: block; }
  .thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 14px; background: var(--line); }
  .title { font-weight: 600; margin: 14px 0 4px; line-height: 1.35; }
  .meta { color: var(--muted); font-size: .9rem; margin: 0 0 16px; }
  .actions { display: flex; gap: 10px; }
  .actions select { flex: 0 0 auto; }
  .actions button { flex: 1; }
  .error { color: var(--danger); margin: 14px 0 0; font-size: .95rem; min-height: 1.2em; }
  footer { color: var(--muted); font-size: .8rem; margin-top: 20px; line-height: 1.5; }
  @media (max-width: 480px) { .row, .actions { flex-direction: column; } }
</style>
</head>
<body>
<main>
  <h1>Clipbox</h1>
  <p class="sub">Paste a YouTube link, then download the video.</p>

  <div class="card">
    <div class="row">
      <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..." aria-label="YouTube link">
      <button id="fetchBtn">Get video</button>
    </div>
    <p class="error" id="error" role="alert"></p>

    <div class="preview" id="preview">
      <img class="thumb" id="thumb" alt="">
      <p class="title" id="title"></p>
      <p class="meta" id="meta"></p>
      <div class="actions">
        <select id="quality" aria-label="Quality">
          <option value="best">Best quality</option>
          <option value="720">720p</option>
          <option value="480">480p</option>
          <option value="360">360p</option>
          <option value="audio">Audio only</option>
        </select>
        <button id="dlBtn">Download</button>
      </div>
    </div>
  </div>

  <footer>Only download videos you own or have permission to save. Downloading may breach YouTube's Terms of Service.</footer>
</main>

<script>
  // Backend address.
  // If the Flask server serves this page, no setting is needed.
  // If the page is opened any other way (Live Server, file, GitHub Pages),
  // it calls BACKEND_URL. For GitHub Pages, set it to your deployed backend,
  // e.g. "https://clipbox.onrender.com"
  const BACKEND_URL = "http://localhost:5000";
  const onBackend = location.protocol.startsWith("http") && !location.hostname.endsWith("github.io") && location.port !== "5500" && location.port !== "5501" && location.port !== "3000";
  const API_BASE = onBackend ? "" : BACKEND_URL;

  const $ = id => document.getElementById(id);
  const urlInput = $("url"), fetchBtn = $("fetchBtn"), dlBtn = $("dlBtn");
  const errorEl = $("error"), preview = $("preview");

  const fmt = s => {
    if (!s) return "";
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
    return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(sec).padStart(2, "0");
  };

  async function getInfo() {
    errorEl.textContent = "";
    preview.classList.remove("show");
    const url = urlInput.value.trim();
    if (!url) { errorEl.textContent = "Paste a YouTube link first."; return; }
    fetchBtn.disabled = true; fetchBtn.textContent = "Loading…";
    try {
      const res = await fetch(`${API_BASE}/api/info?url=${encodeURIComponent(url)}`);
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); }
      catch { throw new Error("The backend isn't running. Start it with: python app.py"); }
      if (!res.ok) throw new Error(data.error);
      $("thumb").src = data.thumbnail || "";
      $("title").textContent = data.title;
      $("meta").textContent = [data.channel, fmt(data.duration)].filter(Boolean).join(" • ");
      preview.classList.add("show");
    } catch (e) {
      errorEl.textContent = e instanceof TypeError
        ? "Can't reach the backend. Start it with: python app.py"
        : e.message;
    } finally {
      fetchBtn.disabled = false; fetchBtn.textContent = "Get video";
    }
  }

  function download() {
    const url = urlInput.value.trim(), q = $("quality").value;
    dlBtn.disabled = true; dlBtn.textContent = "Preparing…";
    window.location.href = `${API_BASE}/api/download?url=${encodeURIComponent(url)}&quality=${q}`;
    setTimeout(() => { dlBtn.disabled = false; dlBtn.textContent = "Download"; }, 6000);
  }

  fetchBtn.addEventListener("click", getInfo);
  dlBtn.addEventListener("click", download);
  urlInput.addEventListener("keydown", e => { if (e.key === "Enter") getInfo(); });
</script>
</body>
</html>
